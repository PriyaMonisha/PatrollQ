# filename: .github/workflows/ci.yml
# purpose:  PatrolIQ CI — lint, unit tests, docker build
# version:  1.0
#
# Runs on every push and PR to main/master.
# Does NOT run the training pipeline — data file is gitignored.
# CI validates: code quality → unit tests → image builds cleanly.

name: PatrolIQ CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 src/ pages/ streamlit_app.py config.py \
            --max-line-length=120 \
            --extend-ignore=E221,E202,E302,E305,E402,W503,W504,F401

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short --ignore=tests/mlflow

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t patroliq:ci .

      - name: Verify image starts
        run: |
          docker run -d --name patroliq-test -p 8501:8501 patroliq:ci
          sleep 15
          docker ps | grep patroliq-test
          docker stop patroliq-test
          docker rm patroliq-test
