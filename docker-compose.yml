# filename: docker-compose.yml
# purpose:  PatrolIQ full MLOps stack — Streamlit + FastAPI + Prometheus + Grafana
# version:  2.1
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Rebuild: docker compose build --no-cache
# Logs:    docker compose logs -f api
#
# Required env vars (set in .env or shell before docker compose up):
#   PATROLIQ_API_KEY        — API key for /v1/admin/* endpoints
#   GRAFANA_ADMIN_PASSWORD  — Grafana admin password (default: admin for local dev)
#
# Services:
#   streamlit  → http://localhost:8501  (dashboard)
#   api        → http://localhost:8000  (FastAPI inference)
#   prometheus → http://localhost:9090  (metrics collector)
#   grafana    → http://localhost:3000  (dashboard)

services:

  # ── Streamlit Dashboard ───────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patroliq-streamlit
    ports:
      - "8501:8501"
    environment:
      - ARTIFACTS_DIR=/app/artifacts
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    volumes:
      - ./mlruns:/app/mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      start_period: 30s
      interval: 15s
      timeout: 10s
      retries: 3
    mem_limit: 2g
    restart: unless-stopped

  # ── FastAPI Inference + Prometheus /metrics ────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: patroliq-api
    ports:
      - "8000:8000"
    environment:
      - ARTIFACTS_DIR=/app/artifacts
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
      - PATROLIQ_API_KEY=${PATROLIQ_API_KEY:-}
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 1g
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: patroliq-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - api
    mem_limit: 512m
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: patroliq-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    mem_limit: 512m
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
